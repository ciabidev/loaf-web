<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0,  interactive-widget=resizes-content viewport-fit=cover maximum-scale=1.0 user-scalable=no"
		/>
		<meta name="description" content="a cozy component library and gallery for Svelte 5" />
		<meta name="keywords" content="Svelte, components, UI, themes" />
		<meta name="author" content="wheatwhole" />

		<meta property="og:title" content="Loafkit UI" />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:description" content="a cozy component library and gallery for Svelte 5" />
		<meta property="og:image" content="%sveltekit.assets%/icons/biology.jpg" />

		<script>
			// Apply persisted flavor early to prevent flash of default theme.
			// The data attribute triggers the correct CSS variables from flavors.css.
			try {
				const f = localStorage.getItem('flavor') || 'rain';
				const t = localStorage.getItem('flavorType');
				if (f) document.documentElement.setAttribute('data-flavor', f);
				if (t) document.documentElement.setAttribute('data-flavor-type', t);
			} catch (e) {
				// ignore localStorage errors (e.g., in private mode)
			}
		</script>
		%sveltekit.head%
	</head>
		<title>Loafkit UI</title>

	<body
		data-sveltekit-preload-data="hover"
		data-sveltekit-preload-code="eager"
		style="background-color: var(--loaf-surface)"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
